name: CI Pipeline

on:
  push:
    branches: [ main, 'integration/*', 'feature/*', 'fix/*' ]
  pull_request:
    branches: [ main, 'integration/*' ]

jobs:
  backend-test:
    name: Backend Pytest & Release Model Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend pytest suite
        run: |
          python -m pytest -q

      - name: Verify exact release models inference replay
        run: |
          python -m scripts.verify_release_models

  frontend-test-and-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Run production build
        run: npm run build
